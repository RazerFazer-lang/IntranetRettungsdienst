<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Digitales Rettungsdienst-Intranet mit Abfrage- und Entscheidungshilfen.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RD Intranet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Rettungsdienst Intranet</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="enhancements.css">
  <link rel="stylesheet" href="search-preview-v2.css">
  <link rel="stylesheet" href="search-layer-v6.css">
  <link rel="stylesheet" href="manv.css">
  <link rel="stylesheet" href="checklists.css">
  <link rel="stylesheet" href="checklists-enhanced.css">
  <link rel="stylesheet" href="notfallbilder.css">
  <link rel="stylesheet" href="einsatzlagen.css">
  <link rel="stylesheet" href="ausbildung-suite.css">
  <link rel="stylesheet" href="navigation-fixes.css">
  <link rel="stylesheet" href="learning-suite-v2.css">
  <link rel="stylesheet" href="final-ui-overrides.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand" role="button" tabindex="0" aria-label="Zur Startseite" title="Zur Startseite"><div class="brand-mark">✚</div><div><strong>RD INTRANET</strong><span>Digitale Einsatzhilfe</span></div></div>
      <nav class="nav" aria-label="Hauptnavigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span class="nav-label">Startseite</span></button>
        <button class="nav-item" data-view="abfrage"><span class="nav-icon">☷</span><span class="nav-label">Abfragehilfe</span></button>
        <button class="nav-item" data-view="notfallbilder"><span class="nav-icon">✚</span><span class="nav-label">Notfallbilder</span></button>
        <button class="nav-item" data-view="checklisten"><span class="nav-icon">✓</span><span class="nav-label">Checklisten</span></button>
        <button class="nav-item" data-view="medikamente"><span class="nav-icon">▣</span><span class="nav-label">Medikamente</span></button>
        <button class="nav-item" data-view="rechner"><span class="nav-icon">▦</span><span class="nav-label">Rechner</span></button>
        <button class="nav-item" data-view="wissen"><span class="nav-icon">▤</span><span class="nav-label">Wissen</span></button>
      </nav>
      <div class="sidebar-card"><div class="status-dot"></div><div><strong>Offline bereit</strong><span>Nach dem ersten Laden lokal nutzbar</span></div></div>
      <div class="sidebar-footer">Version 1.16 · Ausbildungs-/RP-Modus</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumbs"><span>Rettungsdienst</span><b>/</b><span id="breadcrumbCurrent">Startseite</span></div>
        <div class="top-actions">
          <a class="app-link" href="./">↗ App öffnen</a>
          <button class="icon-button" id="installBtn" title="App installieren" hidden>＋ Installieren</button>
          <button class="icon-button danger" id="emergencyBtn" title="Kritische Situationen">⚠</button>
          <button class="profile-chip"><span class="avatar">RD</span><span>Bereit</span></button>
        </div>
      </header>
      <section id="app" class="page"></section>
    </main>
  </div>
  <div class="modal hidden" id="emergencyModal" role="dialog" aria-modal="true" aria-labelledby="emergencyTitle">
    <div class="modal-card"><div class="modal-head"><div><span class="eyebrow red">SOFORT-ZUGRIFF</span><h2 id="emergencyTitle">Kritische Situationen</h2></div><button class="close" id="closeEmergency">×</button></div><div class="quick-grid" id="emergencyGrid"></div></div>
  </div>
  <script src="data.js"></script>
  <script src="meds.js"></script>
  <script src="app.js"></script>
  <script src="checklists.js"></script>
  <script src="checklists-stable.js"></script>
  <script src="notfallbilder.js"></script>
  <script src="search-preview-v2.js"></script>
  <script src="manv.js"></script>
  <script src="einsatzlagen.js"></script>
  <script>
    (()=>{try{if(!localStorage.getItem('rd-suite-progress-v2')){const old=JSON.parse(localStorage.getItem('rd-suite-progress-v1')||'null');if(old){const core=['abcde','dokumentation','medlernen','gefahren','psychiatrie','pruefung','wissensdatenbank'];const completed={};core.forEach(k=>{if(old.done?.[k])completed[k]=true});localStorage.setItem('rd-suite-progress-v2',JSON.stringify({completed,attempts:{},abcdeIndex:0,medIndex:0,medSeen:[],medQuiz:0,hazardIndex:0,hazardAnswered:0,hazardCorrect:0,psychIndex:0,psychAnswered:0,psychCorrect:0,knowledgeRead:[],quizCorrect:Number(old.quizCorrect||0),quizTotal:Number(old.quizTotal||0),examBest:Number(old.examBest||0),examAttempts:old.examBest?1:0,docs:Number(old.docs||0),updatedAt:Date.now()}))}}}catch{}})();
  </script>
  <script src="ausbildung-suite.js"></script>
  <script src="learning-suite-runtime-fixes.js"></script>
  <script src="navigation-controller.js"></script>
  <script src="ui-fixes.js"></script>
  <script src="canonical-home.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./cache-v7.js').catch(()=>{}));
    let deferredInstallPrompt;
    const installBtn=document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.hidden=false;installBtn.onclick=async()=>{deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.hidden=true;};});
    window.addEventListener('appinstalled',()=>{installBtn.hidden=true;});
  </script>
</body>
</html>
