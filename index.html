<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Digitales Rettungsdienst-Intranet mit Abfrage- und Entscheidungshilfen.">
  <title>Rettungsdienst Intranet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">✚</div>
        <div>
          <strong>RD INTRANET</strong>
          <span>Digitale Einsatzhilfe</span>
        </div>
      </div>

      <nav class="nav" aria-label="Hauptnavigation">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="abfrage"><span>☷</span> Abfragehilfe</button>
        <button class="nav-item" data-view="notfallbilder"><span>✚</span> Notfallbilder</button>
        <button class="nav-item" data-view="checklisten"><span>✓</span> Checklisten</button>
        <button class="nav-item" data-view="wissen"><span>▤</span> Wissen</button>
      </nav>

      <div class="sidebar-card">
        <div class="status-dot"></div>
        <div>
          <strong>Offline bereit</strong>
          <span>Alle Inhalte lokal verfügbar</span>
        </div>
      </div>
      <div class="sidebar-footer">Version 1.0 · Ausbildungsmodus</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Menü öffnen">☰</button>
        <div class="breadcrumbs"><span>Rettungsdienst</span><b>/</b><span id="breadcrumbCurrent">Dashboard</span></div>
        <div class="top-actions">
          <button class="icon-button" id="emergencyBtn" title="Schnellzugriff auf kritische Situationen">⚠</button>
          <button class="profile-chip"><span class="avatar">RD</span><span>Bereit</span></button>
        </div>
      </header>

      <section id="app" class="page"></section>
    </main>
  </div>

  <div class="modal hidden" id="emergencyModal" role="dialog" aria-modal="true" aria-labelledby="emergencyTitle">
    <div class="modal-card">
      <div class="modal-head"><div><span class="eyebrow red">SOFORT-ZUGRIFF</span><h2 id="emergencyTitle">Kritische Situationen</h2></div><button class="close" id="closeEmergency">×</button></div>
      <div class="quick-grid" id="emergencyGrid"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
