name: Code Integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository integrity checks
        run: node tests/code-integrity.js
