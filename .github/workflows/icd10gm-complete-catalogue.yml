name: Build complete ICD-10-GM 2026 catalogue
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-icd10gm.mjs'
      - 'tests/icd10gm-complete-browser.js'
      - '.github/workflows/icd10gm-complete-catalogue.yml'
      - 'krankheitslexikon-plus.js'
      - 'krankheitslexikon-plus.css'
      - 'krankheitslexikon-plus-fixes.css'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download official BfArM terminal ValueSet
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H 'Accept: application/json' \
            -A 'IntranetRettungsdienst ICD-10-GM 2026 importer' \
            'https://terminologien.bfarm.de/rendering_data/ValueSet-icd10gm-terminale-codes-2026.json' \
            -o .icd10gm-valueset-2026.json
          node - <<'NODE'
          const fs=require('fs');
          const p='.icd10gm-valueset-2026.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          const rows=Array.isArray(d.rows)?d.rows:Array.isArray(d?.expansion?.contains)?d.expansion.contains:(Array.isArray(d?.compose?.include)?d.compose.include.flatMap(x=>Array.isArray(x?.concept)?x.concept:[]):[]);
          const unique=new Set(rows.map(x=>String(x.Code||x.code||'').trim()).filter(Boolean));
          console.log(`BfArM ValueSet rows: ${rows.length}; unique codes: ${unique.size}`);
          if(!rows.length) throw new Error('BfArM ValueSet contains no rows');
          NODE
      - name: Build complete terminal catalogue from downloaded BfArM ValueSet
        run: node scripts/build-icd10gm.mjs .icd10gm-valueset-2026.json
      - name: Verify generated catalogue syntax and exact count
        run: |
          node --check krankheitslexikon-all-2026.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('krankheitslexikon-all-2026.js','utf8');
          if(!s.includes('terminalCount:14370')) throw new Error('Generated catalogue does not report terminalCount 14370');
          NODE
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run complete ICD-10-GM browser matrix
        run: |
          for browser in chromium firefox webkit; do
            echo "=== Testing $browser ==="
            BROWSER=$browser node tests/icd10gm-complete-browser.js
          done
      - name: Bump service-worker cache and stage generated catalogue
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='cache-v7.js';
          let s=fs.readFileSync(p,'utf8');
          const m=s.match(/const CACHE='rd-intranet-v(\d+)'/);
          const next=m?Number(m[1])+1:1;
          s=s.replace(/const CACHE='rd-intranet-v\d+'/,`const CACHE='rd-intranet-v${next}'`);
          if(!s.includes("'./krankheitslexikon-all-2026.js'"))s=s.replace("'./krankheiten.js'", "'./krankheitslexikon-all-2026.js','./krankheiten.js'");
          fs.writeFileSync(p,s);
          NODE
          git add krankheitslexikon-all-2026.js cache-v7.js
      - name: Commit generated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add complete ICD-10-GM 2026 catalogue'
            git push origin main
          fi

# Trigger a fresh authoritative ICD-10-GM build after the previous workflow attempts.
