name: Build complete ICD-10-GM 2026 catalogue

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-icd10gm.mjs'
      - '.github/workflows/icd10gm-complete-catalogue.yml'
      - 'krankheitslexikon-plus.js'
      - 'krankheitslexikon-plus.css'
      - 'krankheitslexikon-plus-fixes.css'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official BfArM terminal ValueSet
        run: |
          set -euo pipefail
          rm -f .icd10gm-valueset-2026.json
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H 'Accept: application/json' \
            -A 'IntranetRettungsdienst ICD-10-GM 2026 importer' \
            'https://terminologien.bfarm.de/rendering_data/ValueSet-icd10gm-terminale-codes-2026.json' \
            -o .icd10gm-valueset-2026.json

          node - <<'NODE'
          const fs=require('fs');
          const p='.icd10gm-valueset-2026.json';
          const stat=fs.statSync(p);
          if(stat.size<1000) throw new Error(`Downloaded BfArM file is unexpectedly small: ${stat.size} bytes`);
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          const rows=Array.isArray(d.rows)
            ? d.rows
            : Array.isArray(d?.expansion?.contains)
              ? d.expansion.contains
              : (Array.isArray(d?.compose?.include)
                ? d.compose.include.flatMap(x=>Array.isArray(x?.concept)?x.concept:[])
                : []);
          const unique=new Set(rows.map(x=>String(x.Code||x.code||'').trim()).filter(Boolean));
          console.log(`BfArM ValueSet bytes: ${stat.size}`);
          console.log(`BfArM ValueSet rows: ${rows.length}; unique codes: ${unique.size}`);
          console.log(`First code: ${rows[0]?.Code||rows[0]?.code||'none'}`);
          console.log(`Last code: ${rows.at(-1)?.Code||rows.at(-1)?.code||'none'}`);
          if(rows.length!==14370 || unique.size!==14370){
            throw new Error(`Authoritative terminal catalogue must contain exactly 14370 unique codes; rows=${rows.length}, unique=${unique.size}`);
          }
          NODE

      - name: Build complete terminal catalogue
        run: node scripts/build-icd10gm.mjs .icd10gm-valueset-2026.json

      - name: Verify generated catalogue exactly
        run: |
          node --check krankheitslexikon-all-2026.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('krankheitslexikon-all-2026.js','utf8');
          const m=s.match(/window\.RD_ICD10GM_ALL=(\[.*\]);\nwindow\.RD_ICD10GM_META=/s);
          if(!m) throw new Error('Generated catalogue array not found');
          const entries=JSON.parse(m[1]);
          if(entries.length!==14370) throw new Error(`Generated entries=${entries.length}, expected 14370`);
          const codes=new Set(entries.map(x=>x.code));
          if(codes.size!==14370) throw new Error(`Generated unique codes=${codes.size}, expected 14370`);
          if(!s.includes('terminalCount:14370')) throw new Error('Generated catalogue does not report terminalCount 14370');
          for(const key of ['I21.0','J18.9','A41.9']) if(!codes.has(key)) console.log(`Note: sample ${key} not present in terminal set`);
          console.log(`Verified generated ICD-10-GM terminal entries: ${entries.length}`);
          console.log(`Generated file bytes: ${fs.statSync('krankheitslexikon-all-2026.js').size}`);
          NODE

      - name: Bump service-worker cache and stage generated catalogue
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='cache-v7.js';
          let s=fs.readFileSync(p,'utf8');
          const m=s.match(/const CACHE='rd-intranet-v(\d+)'/);
          const next=m?Number(m[1])+1:1;
          s=s.replace(/const CACHE='rd-intranet-v\d+'/,`const CACHE='rd-intranet-v${next}'`);
          if(!s.includes("'./krankheitslexikon-all-2026.js'")){
            s=s.replace("'./krankheiten.js'", "'./krankheitslexikon-all-2026.js','./krankheiten.js'");
          }
          fs.writeFileSync(p,s);
          console.log(`Service-worker cache bumped to rd-intranet-v${next}`);
          NODE
          git add krankheitslexikon-all-2026.js cache-v7.js

      - name: Commit generated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add complete ICD-10-GM 2026 catalogue'
          git push origin main
