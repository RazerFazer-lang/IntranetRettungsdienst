name: Build complete ICD-10-GM 2026 catalogue
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-icd10gm.mjs'
      - 'tests/icd10gm-complete-browser.js'
      - '.github/workflows/icd10gm-complete-catalogue.yml'
      - 'krankheitslexikon-plus.js'
      - 'krankheitslexikon-plus.css'
      - 'krankheitslexikon-plus-fixes.css'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download official BfArM ICD-10-GM package
        run: |
          git clone --depth 1 https://github.com/gematik/zts-api-client-examples.git .zts
          chmod +x .zts/curl/download.sh
          ./.zts/curl/download.sh -c true -i bfarm.terminologien.icd10gm -l true -o .bfarm-packages
      - name: Build exact terminal catalogue from official BfArM CodeSystem
        run: node scripts/build-icd10gm.mjs .bfarm-packages
      - name: Verify generated catalogue syntax and exact count
        run: |
          node --check krankheitslexikon-all-2026.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('krankheitslexikon-all-2026.js','utf8');
          if(!s.includes('terminalCount:14370')) throw new Error('Generated catalogue does not report terminalCount 14370');
          NODE
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run complete ICD-10-GM browser matrix
        run: |
          for browser in chromium firefox webkit; do
            echo "=== Testing $browser ==="
            BROWSER=$browser node tests/icd10gm-complete-browser.js
          done
      - name: Bump service-worker cache and stage generated catalogue
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='cache-v7.js';
          let s=fs.readFileSync(p,'utf8');
          const m=s.match(/const CACHE='rd-intranet-v(\d+)'/);
          const next=m?Number(m[1])+1:1;
          s=s.replace(/const CACHE='rd-intranet-v\d+'/,`const CACHE='rd-intranet-v${next}'`);
          if(!s.includes("'./krankheitslexikon-all-2026.js'"))s=s.replace("'./krankheiten.js'", "'./krankheitslexikon-all-2026.js','./krankheiten.js'");
          fs.writeFileSync(p,s);
          NODE
          git add krankheitslexikon-all-2026.js cache-v7.js
      - name: Commit generated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add complete ICD-10-GM 2026 catalogue'
            git push origin main
          fi
